<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="./images/IT-logo.svg" />
    <title>STA Ticket System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index,follow" />
    <meta name="description" content="TODO: Project 2 ..." />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Custom Styles -->
    <link rel="stylesheet" href="./stylesheets/main.scss" />
  </head>

  <body>
    <!-- Nav -->
    <div class="user-dash-page">
      <header class="bg-primary text-white py-3 dashboard-header">
        <nav class="container-fluid px-3 px-md-5 navbar navbar-expand-md navbar-dark">
          <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img class="me-3" src="images/ticket-white.svg" alt="IT Logo" height="30" />
            <span class="fs-4">STA Ticket System</span>
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul
              class="navbar-nav mt-3 mt-md-0 d-flex flex-column flex-md-row justify-content-center justify-content-md-end align-items-center w-100"
            >
              <li class="nav-item mb-2 mb-md-0 me-md-3">
                <a class="btn btn-light text-primary w-100 w-md-auto" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="btn btn-outline-light w-100 w-md-auto" href="contact-help.html">Contact / Help</a>
              </li>
            </ul>
          </div>
        </nav>
      </header>
    </div>

    <!-- Login Form -->
    <main class="d-flex justify-content-center align-items-center vh-100 bg-light dash">
      <div class="card shadow-lg p-5 rounded-4" style="max-width: 400px; width: 100%">
        <h2 class="text-center mb-4 fw-bold">Welcome Back</h2>
        <p class="text-center text-muted mb-4">Sign in to your Weber account</p>

        <div id="alert-container" class="mb-3"></div>
        <form id="login-form">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email</label>
            <input
              type="email"
              class="form-control form-control-lg"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input
              type="password"
              class="form-control form-control-lg"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" />
              <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <a href="https://www.weber.edu/help/" class="small text-decoration-none" target="_blank"
              >Forgot password?</a
            >
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100 mb-3 shadow-sm">Login</button>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer py-5">
      <div class="container">
        <div class="row text-center text-md-start">
          <!-- Column 1: About -->
          <div class="col-md-4 mb-4 d-flex flex-column align-items-center align-items-md-start">
            <h5>STA Ticket System</h5>
            <p>Helping you submit and track IT tickets easily.</p>
          </div>

          <!-- Column 2: Quick Links -->
          <div class="col-md-4 mb-4 d-flex flex-column align-items-center align-items-md-start">
            <h5>Quick Links</h5>
            <ul class="list-unstyled">
              <li><a class="footer-link" href="index.html">Home</a></li>
              <li><a class="footer-link" href="login.html">Login</a></li>
              <li><a class="footer-link" href="contact-help.html">Contact / Help</a></li>
            </ul>
          </div>

          <!-- Column 3: Social -->
          <div class="col-md-4 mb-4 d-flex flex-column align-items-center align-items-md-start">
            <h5>Follow Us</h5>
            <div class="d-flex gap-3">
              <a href="https://www.facebook.com/WeberState" class="text-white fs-4" target="_blank"
                ><i class="bi bi-facebook"></i
              ></a>
              <a href="https://x.com/WeberStateU" class="text-white fs-4" target="_blank"
                ><i class="bi bi-twitter"></i
              ></a>
              <a href="https://www.youtube.com/WeberStateU" class="text-white fs-4" target="_blank"
                ><i class="bi bi-youtube"></i
              ></a>
              <a href="https://www.instagram.com/weberstate/" class="text-white fs-4" target="_blank"
                ><i class="bi bi-instagram"></i
              ></a>
            </div>
          </div>
        </div>
        <hr />
        <p class="text-center mb-0">&copy; 2025 Weber State STAs. All rights reserved.</p>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="./javascripts/main.js"></script>
  </body>
</html>
